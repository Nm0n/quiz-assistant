name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.8.0'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '25.2.9519653'
  ANDROID_BUILD_TOOLS: '33.0.2'
  JDK_VERSION: '17'

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}

      # ============================================================
      # 1. 安装 PySide6 6.8.0
      # ============================================================
      - name: Install PySide6 and deploy tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}"
          pip install "shiboken6==${PYSIDE_VERSION}"
          pip list | grep -i -E "pyside|shiboken"

      # ============================================================
      # 2. 关键步骤：使用 qtpip 下载 Android wheel
      # ============================================================
      - name: Download Android Wheels
        run: |
          pip install qtpip
          mkdir -p wheels
          qtpip download PySide6 --android --arch aarch64 -d ./wheels
          qtpip download shiboken6 --android --arch aarch64 -d ./wheels
          echo "下载的 wheel 文件："
          ls -la wheels/

      # ============================================================
      # 3. 配置 Android SDK / NDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmdline-tools;latest" || true
          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" || true
          if [ ! -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_ZIP="android-ndk-r25b-linux.zip"
            wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
            sudo mkdir -p /opt/android-ndk
            sudo unzip -q "${NDK_ZIP}" -d /opt/android-ndk
          fi

      - name: Export Android environment variables
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            fi
          else
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

          NDK_CANDIDATE=""
          if [ -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_CANDIDATE="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          elif [ -d "/opt/android-ndk/android-ndk-r25b" ]; then
            NDK_CANDIDATE="/opt/android-ndk/android-ndk-r25b"
          fi

          if [ -n "$NDK_CANDIDATE" ]; then
            echo "ANDROID_NDK_HOME=$NDK_CANDIDATE" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$NDK_CANDIDATE" >> "$GITHUB_ENV"
          else
            echo "::error::NDK 未找到，停止构建"
            exit 1
          fi

      # ============================================================
      # 4. 执行打包（关键：手动指定 wheel 和 NDK/SDK 路径）
      # ============================================================
      - name: Run pyside6-android-deploy
        run: |
          set -o pipefail
          # 从下载的 wheel 中提取具体文件名
          WHEEL_PYSIDE=$(ls wheels/PySide6-*android_aarch64.whl | head -1)
          WHEEL_SHIBOKEN=$(ls wheels/shiboken6-*android_aarch64.whl | head -1)
          echo "使用 PySide wheel: $WHEEL_PYSIDE"
          echo "使用 Shiboken wheel: $WHEEL_SHIBOKEN"

          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shiboken "$WHEEL_SHIBOKEN" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --sdk-path "$ANDROID_HOME" \
            --force 2>&1 | tee build.log

      # ============================================================
      # 5. 收集 APK
      # ============================================================
      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          find . -type f -name "*.apk" -not -path "./dist/*" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
