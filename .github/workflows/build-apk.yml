# .github/workflows/build-apk.yml
#
# 关键设计：
#   - 使用 PySide6 6.9.2 + cp311 wheel
#   - NDK/SDK 路径通过命令行 --ndk-path / --sdk-path 传入
#   - 预克隆 p4a 并完整替换 Python 版本（version + md5sum + sha256）
#   - 运行前后诊断独立成步骤，写入文件，随 artifact 上传
#   - 每个步骤末尾只打印摘要，确保 GitHub Actions UI 中可见

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.9.2'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_BUILD_TOOLS: '33.0.2'
  ANDROID_HOME: /usr/local/lib/android/sdk
  TARGET_PYTHON: '3.11.5'

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ============================================================
      # 创建 venv
      # ============================================================
      - name: Create and activate venv
        run: |
          python -m venv $HOME/venv
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          source $HOME/venv/bin/activate
          python --version
          which python
          pip --version

      # ============================================================
      # JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # ============================================================
      # cmdline-tools
      # ============================================================
      - name: Manually install Android cmdline-tools
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R $USER:$USER "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          ls "$ANDROID_HOME/cmdline-tools/latest/lib/" | grep -i "jaxb" || echo "!!! JAXB 未找到，稍后注入 !!!"

      - name: Ensure JAXB in sdkmanager CLASSPATH
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          LIBDIR="$ANDROID_HOME/cmdline-tools/latest/lib"

          mkdir -p "$LIBDIR"
          cd "$LIBDIR"
          wget -q https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/com/sun/xml/bind/jaxb-impl/2.3.1/jaxb-impl-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0/jaxb-core-2.3.0.jar
          wget -q https://repo1.maven.org/maven2/javax/activation/javax.activation-api/1.2.0/javax.activation-api-1.2.0.jar

          if ! grep -q "jaxb-api-2.3.1" "$SDKMGR"; then
            sed -i "s|^CLASSPATH=\"|CLASSPATH=\"$LIBDIR/jaxb-api-2.3.1.jar:$LIBDIR/jaxb-impl-2.3.1.jar:$LIBDIR/jaxb-core-2.3.0.jar:$LIBDIR/javax.activation-api-1.2.0.jar:|" "$SDKMGR"
          fi

          grep -n "CLASSPATH" "$SDKMGR" || true

      - name: Create legacy sdkmanager symlinks
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin"
          mkdir -p "$ANDROID_HOME/cmdline-tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/cmdline-tools/bin/avdmanager"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Verify sdkmanager works
        run: |
          which sdkmanager
          sdkmanager --version

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" || true
          yes | sdkmanager --licenses || true

      # ============================================================
      # NDK r27c
      # ============================================================
      - name: Install Android NDK r27c
        run: |
          yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" || (echo "NDK 安装失败" && exit 1)
          echo "NDK r27c 已安装"

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      # ============================================================
      # 系统依赖
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool \
            libssl-dev make patch patchelf pkg-config \
            python3 python3-dev python3-pip python3-venv \
            unzip wget zip

      # ============================================================
      # 在 venv 里安装 PySide6 和工具
      # ============================================================
      - name: Install PySide6 and deploy tools in venv
        run: |
          source $HOME/venv/bin/activate
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}"
          pip install "shiboken6==${PYSIDE_VERSION}"
          pip install packaging jinja2 pkginfo tqdm
          pip install buildozer cython virtualenv
          pip list | grep -i -E "pyside|shiboken|buildozer"
          which pyside6-android-deploy

      # ============================================================
      # 下载 Android wheel
      # ============================================================
      - name: Download Android Wheels
        run: |
          mkdir -p wheels
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -lh wheels/

      - name: Sanity check project layout
        run: |
          test -f main.py            || (echo "缺少 main.py" && exit 1)
          test -f pysidedeploy.spec  || (echo "缺少 pysidedeploy.spec" && exit 1)
          test -d core               || (echo "缺少 core/" && exit 1)
          test -d qml                || (echo "缺少 qml/" && exit 1)
          test -f qml/main.qml       || (echo "缺少 qml/main.qml" && exit 1)

      # ============================================================
      # 下载 Python 3.11.5 源码包并计算校验和
      # ============================================================
      - name: Download Python ${{ env.TARGET_PYTHON }} and compute checksums
        run: |
          cd /tmp
          wget -q "https://www.python.org/ftp/python/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz" \
            -O "Python-${TARGET_PYTHON}.tar.xz"
          ls -lh "Python-${TARGET_PYTHON}.tar.xz"

          MD5=$(md5sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')
          SHA256=$(sha256sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')

          echo "PY_TARBALL_MD5=$MD5" >> "$GITHUB_ENV"
          echo "PY_TARBALL_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "======== Python ${TARGET_PYTHON} 校验和 ========"
          echo "MD5    = $MD5"
          echo "SHA256 = $SHA256"

      # ============================================================
      # 预克隆 p4a 并完整替换 Python 版本
      # ============================================================
      - name: Pre-clone p4a and force Python ${{ env.TARGET_PYTHON }}
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          rm -rf "$GITHUB_WORKSPACE/.buildozer"
          mkdir -p "$(dirname "$P4A_DIR")"

          git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          cd "$P4A_DIR"

          echo "======== 修改前：grep 3.14 出现位置 ========"
          for RECIPE_NAME in python3 hostpython3; do
            RECIPE_FILE="pythonforandroid/recipes/$RECIPE_NAME/__init__.py"
            echo "---- $RECIPE_FILE ----"
            grep -nE "3\.14" "$RECIPE_FILE" || echo "(没有 3.14 出现)"
          done

          for RECIPE_NAME in python3 hostpython3; do
            RECIPE_FILE="pythonforandroid/recipes/$RECIPE_NAME/__init__.py"
            echo ""
            echo "======== 修改 $RECIPE_NAME ========"

            sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)['\"]3\.[0-9]+\.[0-9]+['\"]/\1'${TARGET_PYTHON}'/" "$RECIPE_FILE"
            sed -i -E "s/^([[:space:]]*md5sum[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_MD5}'/" "$RECIPE_FILE"
            sed -i -E "s/^([[:space:]]*sha256[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_SHA256}'/" "$RECIPE_FILE"
            sed -i -E "s|/3\.14\.[0-9]+/Python-3\.14\.[0-9]+\.tar\.xz|/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz|g" "$RECIPE_FILE"

            echo "---- 修改后 ----"
            grep -nE "version|md5sum|sha256|url" "$RECIPE_FILE" | head -20
          done

          echo ""
          echo "======== 最终检查：recipe 里是否还有 3.14 ========"
          for RECIPE_NAME in python3 hostpython3; do
            RECIPE_FILE="pythonforandroid/recipes/$RECIPE_NAME/__init__.py"
            echo "---- $RECIPE_FILE ----"
            grep -nE "3\.14" "$RECIPE_FILE" && echo "!!! 仍有 3.14 残留，需要检查 !!!" || echo "✅ 无 3.14 残留"
          done

      # ============================================================
      # 清理 p4a 构建缓存
      # ============================================================
      - name: Clean p4a build cache
        run: |
          set -e
          PLATFORM_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform"

          echo "======== 清理前：platform 目录内容 ========"
          ls -la "$PLATFORM_DIR" || true

          find "$PLATFORM_DIR" -maxdepth 1 -type d -name "build-*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/dists" 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/build" 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/.buildozer" 2>/dev/null || true

          echo "======== 清理后：platform 目录内容 ========"
          ls -la "$PLATFORM_DIR" || true

          echo "======== 确认 p4a recipe 状态 ========"
          grep -nE "^[[:space:]]*version[[:space:]]*=" "$PLATFORM_DIR/python-for-android/pythonforandroid/recipes/python3/__init__.py" || true

      # ============================================================
      # 【新增】运行前诊断：写入独立文件，供 artifact 上传
      # ============================================================
      - name: Pre-deploy diagnostics
        run: |
          DIAG="$GITHUB_WORKSPACE/pre-deploy-diagnostics.txt"
          {
            echo "============================================================"
            echo "======== Pre-deploy Diagnostics ========"
            echo "============================================================"
            echo ""
            echo "---- workspace platform 目录 ----"
            ls -la "$GITHUB_WORKSPACE/.buildozer/android/platform" 2>&1 || true
            echo ""
            echo "---- workspace p4a recipe 状态 ----"
            P4A_RECIPE="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py"
            if [ -f "$P4A_RECIPE" ]; then
              grep -nE "^[[:space:]]*version[[:space:]]*=" "$P4A_RECIPE" || true
            else
              echo "!!! p4a recipe 文件不存在：$P4A_RECIPE"
            fi
            echo ""
            echo "---- HOME 下可能的 buildozer 缓存 ----"
            ls -la "$HOME/.buildozer" 2>&1 || echo "无 ~/.buildozer"
            ls -la "$HOME/.pyside6-android-deploy" 2>&1 || echo "无 ~/.pyside6-android-deploy"
            ls -la "$HOME/.local/share" 2>&1 | head -20 || echo "无 ~/.local/share"
            echo ""
            echo "---- 查找所有 python-for-android 目录 ----"
            find / -type d -name "python-for-android" 2>/dev/null | head -20 || true
            echo ""
            echo "---- 查找所有 build-arm64-v8a 目录 ----"
            find / -type d -name "build-arm64-v8a" 2>/dev/null | head -20 || true
            echo ""
            echo "---- 查找所有 libpython3.14.so ----"
            find / -name "libpython3.14.so" 2>/dev/null | head -20 || true
            echo ""
            echo "---- 查找所有 libpython3.11.so ----"
            find / -name "libpython3.11.so" 2>/dev/null | head -20 || true
          } > "$DIAG" 2>&1

          echo "======== 运行前诊断摘要（仅打印关键行）========"
          grep -E "python-for-android|libpython3|version" "$DIAG" | head -20 || true
          echo "（完整诊断见 artifact: pre-deploy-diagnostics.txt）"

      # ============================================================
      # 运行 pyside6-android-deploy
      # ============================================================
      - name: Run pyside6-android-deploy
        run: |
          set -o pipefail
          source $HOME/venv/bin/activate

          echo "======== 开始 pyside6-android-deploy ========"
          echo "NDK: $ANDROID_NDK_HOME"
          echo "SDK: $ANDROID_HOME"

          WHEEL_PYSIDE="wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          WHEEL_SHIBOKEN="wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"

          set +e
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shiboken "$WHEEL_SHIBOKEN" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --sdk-path "$ANDROID_HOME" \
            2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "pyside6-android-deploy 退出码: $EXIT_CODE"
          exit $EXIT_CODE

      # ============================================================
      # 【新增】运行后诊断：独立步骤，always()，写入文件
      # ============================================================
      - name: Post-deploy diagnostics
        if: always()
        run: |
          DIAG="$GITHUB_WORKSPACE/post-deploy-diagnostics.txt"
          {
            echo "============================================================"
            echo "======== Post-deploy Diagnostics ========"
            echo "============================================================"
            echo ""
            echo "---- workspace platform 目录 ----"
            ls -la "$GITHUB_WORKSPACE/.buildozer/android/platform" 2>&1 || true
            echo ""
            echo "---- deploy 之后：p4a recipe 状态 ----"
            P4A_RECIPE="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py"
            if [ -f "$P4A_RECIPE" ]; then
              grep -nE "^[[:space:]]*version[[:space:]]*=" "$P4A_RECIPE" || echo "未找到 version 行"
            else
              echo "!!! p4a recipe 文件不存在：$P4A_RECIPE"
            fi
            echo ""
            echo "---- 查找所有 python-for-android 目录 ----"
            find / -type d -name "python-for-android" 2>/dev/null | head -20 || true
            echo ""
            echo "---- 查找所有 build-arm64-v8a 目录 ----"
            find / -type d -name "build-arm64-v8a" 2>/dev/null | head -20 || true
            echo ""
            echo "---- 查找所有 libpython3.14.so ----"
            find / -name "libpython3.14.so" 2>/dev/null | head -20 || true
            echo ""
            echo "---- 查找所有 libpython3.11.so ----"
            find / -name "libpython3.11.so" 2>/dev/null | head -20 || true
            echo ""
            echo "---- build.log 中 p4a 相关行 ----"
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              grep -nE "python-for-android|p4a|buildozer|Downloading Python|Building python" "$GITHUB_WORKSPACE/build.log" | head -80 || true
            else
              echo "build.log 不存在"
            fi
            echo ""
            echo "---- build.log 中 Python 版本相关行 ----"
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              grep -nE "3\.14|3\.11" "$GITHUB_WORKSPACE/build.log" | head -60 || true
            fi
            echo ""
            echo "---- build.log 末尾 100 行 ----"
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              tail -100 "$GITHUB_WORKSPACE/build.log" || true
            fi
            echo ""
            echo "---- 所有 APK 文件 ----"
            find "$GITHUB_WORKSPACE" -type f -name "*.apk" 2>/dev/null || true
          } > "$DIAG" 2>&1

          echo "======== 运行后诊断摘要（仅打印关键行）========"
          grep -E "python-for-android|libpython3|version|3\.14|3\.11" "$DIAG" | head -20 || true
          echo "（完整诊断见 artifact: post-deploy-diagnostics.txt）"

      # ============================================================
      # 收集 APK
      # ============================================================
      - name: Collect APK artifacts
        if: always()
        run: |
          mkdir -p dist
          find . -type f -name "*.apk" \
            -not -path "./dist/*" \
            -not -path "./.buildozer/*" \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist/ || echo "dist/ 目录为空"

      - name: List project root files for debugging
        if: always()
        run: |
          echo "=== 项目根目录 ==="
          ls -la
          echo "=== 查找所有 APK ==="
          find . -type f -name "*.apk" 2>/dev/null || echo "未找到 APK"

      # ============================================================
      # 校验 APK 内容
      # ============================================================
      - name: Verify APK contains libpython3.11.so
        if: always()
        run: |
          APK=$(find dist -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "没有找到 APK，跳过验证"
            exit 0
          fi
          echo "检查 APK: $APK"
          echo "=== lib/arm64-v8a/ 中的 libpython 和 libshiboken ==="
          unzip -l "$APK" | grep -E "libpython|libshiboken|libc\+\+" || true
          echo ""
          echo "=== 关键判定 ==="
          if unzip -l "$APK" | grep -q "libpython3.11.so"; then
            echo "✅ APK 中包含 libpython3.11.so"
          elif unzip -l "$APK" | grep -q "libpython3.14.so"; then
            echo "❌ APK 中仍然是 libpython3.14.so"
            echo "   说明 p4a 仍然构建了 Python 3.14，recipe 补丁未生效或被缓存覆盖"
          else
            echo "❌ APK 中没有任何 libpython3.x.so"
          fi

          echo ""
          echo "=== 检查 libc++_shared.so 是否包含 std::pmr 符号 ==="
          mkdir -p /tmp/apkcheck
          unzip -o "$APK" "lib/arm64-v8a/libc++_shared.so" -d /tmp/apkcheck 2>/dev/null || true
          if [ -f /tmp/apkcheck/lib/arm64-v8a/libc++_shared.so ]; then
            READELF=$(find "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" -name "llvm-readelf" 2>/dev/null | head -1)
            if [ -n "$READELF" ]; then
              echo "使用 llvm-readelf 检查符号..."
              "$READELF" -sW /tmp/apkcheck/lib/arm64-v8a/libc++_shared.so | grep -i "monotonic_buffer_resource" && echo "✅ 找到 pmr 符号" || echo "❌ 未找到 pmr 符号"
            else
              echo "未找到 llvm-readelf，跳过符号检查"
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log and diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            pre-deploy-diagnostics.txt
            post-deploy-diagnostics.txt
            .buildozer/**/build.log
            .buildozer/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
