# .github/workflows/build-apk.yml

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.9.2'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_BUILD_TOOLS: '33.0.2'
  ANDROID_HOME: /usr/local/lib/android/sdk
  TARGET_PYTHON: '3.11.5'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and activate venv
        run: |
          python -m venv $HOME/venv
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          source $HOME/venv/bin/activate
          python --version
          which python

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Manually install Android cmdline-tools
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R $USER:$USER "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

      - name: Ensure JAXB in sdkmanager CLASSPATH
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          LIBDIR="$ANDROID_HOME/cmdline-tools/latest/lib"

          mkdir -p "$LIBDIR"
          cd "$LIBDIR"
          wget -q https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/com/sun/xml/bind/jaxb-impl/2.3.1/jaxb-impl-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0/jaxb-core-2.3.0.jar
          wget -q https://repo1.maven.org/maven2/javax/activation/javax.activation-api/1.2.0/javax.activation-api-1.2.0.jar

          if ! grep -q "jaxb-api-2.3.1" "$SDKMGR"; then
            sed -i "s|^CLASSPATH=\"|CLASSPATH=\"$LIBDIR/jaxb-api-2.3.1.jar:$LIBDIR/jaxb-impl-2.3.1.jar:$LIBDIR/jaxb-core-2.3.0.jar:$LIBDIR/javax.activation-api-1.2.0.jar:|" "$SDKMGR"
          fi

      - name: Create legacy sdkmanager symlinks
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin"
          mkdir -p "$ANDROID_HOME/cmdline-tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/cmdline-tools/bin/avdmanager"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Verify sdkmanager works
        run: |
          which sdkmanager
          sdkmanager --version

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" || true
          yes | sdkmanager --licenses || true

      - name: Install Android NDK r27c
        run: |
          yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" || (echo "NDK 安装失败" && exit 1)
          ls "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/" | head -20

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool \
            libssl-dev make patch patchelf pkg-config \
            python3 python3-dev python3-pip python3-venv \
            unzip wget zip

      - name: Install PySide6 and deploy tools in venv
        run: |
          source $HOME/venv/bin/activate
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}"
          pip install "shiboken6==${PYSIDE_VERSION}"
          pip install packaging jinja2 pkginfo tqdm
          pip install buildozer cython virtualenv
          pip list | grep -i -E "pyside|shiboken|buildozer"
          which pyside6-android-deploy

      - name: Download Android Wheels
        run: |
          mkdir -p wheels
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -lh wheels/

      - name: Sanity check project layout
        run: |
          test -f main.py            || (echo "缺少 main.py" && exit 1)
          test -f pysidedeploy.spec  || (echo "缺少 pysidedeploy.spec" && exit 1)
          test -d core               || (echo "缺少 core/" && exit 1)
          test -d qml                || (echo "缺少 qml/" && exit 1)
          test -f qml/main.qml       || (echo "缺少 qml/main.qml" && exit 1)

      - name: Download Python ${{ env.TARGET_PYTHON }} and compute checksums
        run: |
          cd /tmp
          wget -q "https://www.python.org/ftp/python/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz" \
            -O "Python-${TARGET_PYTHON}.tar.xz"
          ls -lh "Python-${TARGET_PYTHON}.tar.xz"

          MD5=$(md5sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')
          SHA256=$(sha256sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')

          echo "PY_TARBALL_MD5=$MD5" >> "$GITHUB_ENV"
          echo "PY_TARBALL_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "MD5    = $MD5"
          echo "SHA256 = $SHA256"

      # ============================================================
      # Pre-clone p4a + 打补丁
      # ============================================================
      - name: Pre-clone p4a to both locations and patch
        run: |
          set -e

          P4A_DIR_A="$GITHUB_WORKSPACE/python-for-android"
          P4A_DIR_B="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          rm -rf "$P4A_DIR_A" "$GITHUB_WORKSPACE/.buildozer"
          mkdir -p "$(dirname "$P4A_DIR_B")"

          echo "======== Clone p4a 到位置 A ========"
          git clone -b develop --single-branch https://github.com/kivy/python-for-android.git "$P4A_DIR_A"
          cp -r "$P4A_DIR_A" "$P4A_DIR_B"

          for P4A_DIR in "$P4A_DIR_A" "$P4A_DIR_B"; do
            echo ""
            echo "============================================================"
            echo "======== 给 $P4A_DIR 打补丁 ========"
            echo "============================================================"
            cd "$P4A_DIR"

            # ---------- 1. recipe 版本修补 ----------
            for RECIPE_NAME in python3 hostpython3; do
              RECIPE_FILE="pythonforandroid/recipes/$RECIPE_NAME/__init__.py"
              sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)['\"]3\.[0-9]+\.[0-9]+['\"]/\1'${TARGET_PYTHON}'/" "$RECIPE_FILE"
              sed -i -E "s/^([[:space:]]*md5sum[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_MD5}'/" "$RECIPE_FILE"
              sed -i -E "s/^([[:space:]]*sha256[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_SHA256}'/" "$RECIPE_FILE"
              sed -i -E "s|/3\.14\.[0-9]+/Python-3\.14\.[0-9]+\.tar\.xz|/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz|g" "$RECIPE_FILE"
              grep -nE "^[[:space:]]*version[[:space:]]*=" "$RECIPE_FILE" | head -3
            done

            # ---------- 2. JNI 修复：在 onCreate 里注入 Qt6Core 加载 + setActivity ----------
            echo ""
            echo "======== JNI 修复：onCreate 注入 ========"

            find "$P4A_DIR" -name "PythonActivity.java" -type f 2>/dev/null > /tmp/java_list.txt
            cat /tmp/java_list.txt

            while IFS= read -r jf; do
              [ -f "$jf" ] || continue
              grep -q "class PythonActivity" "$jf" 2>/dev/null || continue

              if grep -q "qtInitOnCreate" "$jf" 2>/dev/null; then
                echo "  已存在补丁: $jf"
                continue
              fi

              # 用 awk 在 onCreate 方法体的第一条语句位置插入
              awk '
                # 情况 1: onCreate 定义和 { 在同一行
                /void[ \t]+onCreate[ \t]*\(/ && !inserted {
                    if (/\{/) {
                        print
                        print "        /* qtInitOnCreate */"
                        print "        try {"
                        print "            String abi = android.os.Build.SUPPORTED_ABIS[0];"
                        print "            System.loadLibrary(\"Qt6Core_\" + abi);"
                        print "            org.qtproject.qt.android.QtNative.setActivity(this);"
                        print "            android.util.Log.i(\"QtInitPatch\", \"Qt6Core loaded and setActivity called\");"
                        print "        } catch (Throwable t) {"
                        print "            t.printStackTrace();"
                        print "        }"
                        inserted = 1
                        next
                    }
                    in_oc = 1
                    print
                    next
                }
                # 情况 2: 需要等到下一行的 {
                in_oc && /\{/ && !inserted {
                    print
                    print "        /* qtInitOnCreate */"
                    print "        try {"
                    print "            String abi = android.os.Build.SUPPORTED_ABIS[0];"
                    print "            System.loadLibrary(\"Qt6Core_\" + abi);"
                    print "            org.qtproject.qt.android.QtNative.setActivity(this);"
                    print "            android.util.Log.i(\"QtInitPatch\", \"Qt6Core loaded and setActivity called\");"
                    print "        } catch (Throwable t) {"
                    print "            t.printStackTrace();"
                    print "        }"
                    inserted = 1
                    in_oc = 0
                    next
                }
                { print }
              ' "$jf" > "$jf.new"
              mv "$jf.new" "$jf"
              echo "  已打补丁: $jf"
            done < /tmp/java_list.txt

            # ---------- 强制验证 ----------
            QT_JAVA=$(find "$P4A_DIR" -path "*bootstraps/qt*" -name "PythonActivity.java" -type f 2>/dev/null | head -1)
            if [ -z "$QT_JAVA" ]; then
              echo "!!! 找不到 bootstraps/qt 下的 PythonActivity.java"
              exit 1
            fi
            if ! grep -q "qtInitOnCreate" "$QT_JAVA" 2>/dev/null; then
              echo "!!! Qt bootstrap 补丁未生效"
              head -60 "$QT_JAVA"
              exit 1
            fi
            echo "✅ Qt bootstrap 补丁确认: $QT_JAVA"
            grep -A 12 "qtInitOnCreate" "$QT_JAVA" | head -14

            # ---------- 3. manifest 权限注入 ----------
            echo ""
            echo "======== manifest 权限注入 ========"
            MANIFEST_FILES=$(find "$P4A_DIR" -type f \( -name "AndroidManifest*.xml" -o -name "AndroidManifest*.tmpl*" \) 2>/dev/null || true)
            echo "$MANIFEST_FILES" | while IFS= read -r mf; do
              [ -f "$mf" ] || continue
              grep -q '<manifest' "$mf" 2>/dev/null || continue
              grep -q '<application' "$mf" 2>/dev/null || continue
              grep -q 'MANAGE_EXTERNAL_STORAGE' "$mf" && continue

              if ! grep -q 'xmlns:tools=' "$mf"; then
                sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' "$mf" || true
              fi
              sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n    <application|' "$mf" || true
              echo "已注入权限到 $mf"
            done
          done

          echo ""
          echo "======== 最终确认 ========"
          echo "位置 A p4a: $(test -d "$P4A_DIR_A" && echo 存在 || echo 不存在)"
          echo "位置 B p4a: $(test -d "$P4A_DIR_B" && echo 存在 || echo 不存在)"

      - name: Patch buildozer default.spec to use our p4a
        run: |
          source $HOME/venv/bin/activate
          DEFAULT_SPEC="$VIRTUAL_ENV/lib/python3.11/site-packages/buildozer/default.spec"

          if [ ! -f "$DEFAULT_SPEC" ]; then
            echo "找不到 default.spec"
            find "$VIRTUAL_ENV" -name "default.spec" 2>/dev/null || true
            exit 1
          fi

          P4A_DIR_B="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          if grep -q "^p4a.source_dir" "$DEFAULT_SPEC"; then
            sed -i "s|^p4a.source_dir.*|p4a.source_dir = ${P4A_DIR_B}|" "$DEFAULT_SPEC"
          else
            sed -i "/^\[buildozer\]/a p4a.source_dir = ${P4A_DIR_B}" "$DEFAULT_SPEC"
          fi

          grep -A 20 "^\[buildozer\]" "$DEFAULT_SPEC" || true

      - name: Clean p4a build cache
        run: |
          PLATFORM_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform"
          find "$PLATFORM_DIR" -maxdepth 1 -type d -name "build-*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/dists" 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/build" 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/.buildozer" 2>/dev/null || true

      # ============================================================
      # 后台 patcher：监控 recipe + Java + manifest
      # ============================================================
      - name: Start background p4a patcher
        run: |
          PATCHER_SCRIPT="$GITHUB_WORKSPACE/p4a_patcher.sh"

          cat > "$PATCHER_SCRIPT" <<'PATCHER_EOF'
          #!/bin/bash
          LOG="/tmp/patcher.log"
          echo "[Patcher] 启动于 $(date)" > "$LOG"

          inject_manifest() {
              local mf="$1"
              [ -f "$mf" ] || return 0
              grep -q '<manifest' "$mf" 2>/dev/null || return 0
              grep -q '<application' "$mf" 2>/dev/null || return 0
              grep -q 'MANAGE_EXTERNAL_STORAGE' "$mf" 2>/dev/null && return 0
              if ! grep -q 'xmlns:tools=' "$mf"; then
                  sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' "$mf" 2>/dev/null || true
              fi
              sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n    <application|' "$mf" 2>/dev/null || true
              echo "[Patcher] $(date) manifest: $mf" >> "$LOG"
          }

          patch_java() {
              local jf="$1"
              [ -f "$jf" ] || return 0
              grep -q "class PythonActivity" "$jf" 2>/dev/null || return 0
              grep -q "qtInitOnCreate" "$jf" 2>/dev/null && return 0

              awk '
                /void[ \t]+onCreate[ \t]*\(/ && !inserted {
                    if (/\{/) {
                        print
                        print "        /* qtInitOnCreate */"
                        print "        try {"
                        print "            String abi = android.os.Build.SUPPORTED_ABIS[0];"
                        print "            System.loadLibrary(\"Qt6Core_\" + abi);"
                        print "            org.qtproject.qt.android.QtNative.setActivity(this);"
                        print "            android.util.Log.i(\"QtInitPatch\", \"Qt6Core loaded and setActivity called\");"
                        print "        } catch (Throwable t) {"
                        print "            t.printStackTrace();"
                        print "        }"
                        inserted = 1
                        next
                    }
                    in_oc = 1
                    print
                    next
                }
                in_oc && /\{/ && !inserted {
                    print
                    print "        /* qtInitOnCreate */"
                    print "        try {"
                    print "            String abi = android.os.Build.SUPPORTED_ABIS[0];"
                    print "            System.loadLibrary(\"Qt6Core_\" + abi);"
                    print "            org.qtproject.qt.android.QtNative.setActivity(this);"
                    print "            android.util.Log.i(\"QtInitPatch\", \"Qt6Core loaded and setActivity called\");"
                    print "        } catch (Throwable t) {"
                    print "            t.printStackTrace();"
                    print "        }"
                    inserted = 1
                    in_oc = 0
                    next
                }
                { print }
              ' "$jf" > "$jf.new"
              mv "$jf.new" "$jf"
              echo "[Patcher] $(date) java: $jf" >> "$LOG"
          }

          while true; do
              for P4A_DIR in \
                "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android" \
                "$GITHUB_WORKSPACE/python-for-android" \
                "$HOME/.buildozer/android/platform/python-for-android" ; do
                  [ -d "$P4A_DIR" ] || continue

                  for RECIPE_REL in "pythonforandroid/recipes/python3/__init__.py" "pythonforandroid/recipes/hostpython3/__init__.py" ; do
                      RECIPE_FILE="$P4A_DIR/$RECIPE_REL"
                      if [ -f "$RECIPE_FILE" ] && grep -qE "3\.14" "$RECIPE_FILE"; then
                          sed -i -E "s/version = '3\.14\.[0-9]+'/version = '${TARGET_PYTHON}'/" "$RECIPE_FILE" 2>/dev/null || true
                          sed -i -E "s/version = \"3\.14\.[0-9]+\"/version = '${TARGET_PYTHON}'/" "$RECIPE_FILE" 2>/dev/null || true
                          sed -i -E "s/md5sum = '[a-fA-F0-9]+'/md5sum = '${PY_TARBALL_MD5}'/" "$RECIPE_FILE" 2>/dev/null || true
                          sed -i -E "s/sha256 = '[a-fA-F0-9]+'/sha256 = '${PY_TARBALL_SHA256}'/" "$RECIPE_FILE" 2>/dev/null || true
                      fi
                  done

                  find "$P4A_DIR" -name "PythonActivity.java" -type f 2>/dev/null > /tmp/java_list.txt
                  while IFS= read -r jf; do
                      patch_java "$jf"
                  done < /tmp/java_list.txt

                  find "$P4A_DIR" -type f \( -name "AndroidManifest*.xml" -o -name "AndroidManifest*.tmpl*" \) 2>/dev/null > /tmp/manifest_list.txt
                  while IFS= read -r mf; do
                      inject_manifest "$mf"
                  done < /tmp/manifest_list.txt
              done

              for DIST_DIR in \
                "$HOME/.buildozer/android/platform/build-arm64-v8a/dists" \
                "$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/dists" ; do
                  [ -d "$DIST_DIR" ] || continue
                  find "$DIST_DIR" -name "PythonActivity.java" -type f 2>/dev/null > /tmp/java_list2.txt
                  while IFS= read -r jf; do
                      patch_java "$jf"
                  done < /tmp/java_list2.txt
                  find "$DIST_DIR" -name "AndroidManifest*.xml" -type f 2>/dev/null > /tmp/manifest_list2.txt
                  while IFS= read -r mf; do
                      inject_manifest "$mf"
                  done < /tmp/manifest_list2.txt
              done

              sleep 1
          done
          PATCHER_EOF

          chmod +x "$PATCHER_SCRIPT"
          nohup "$PATCHER_SCRIPT" > /dev/null 2>&1 &
          echo "$!" > /tmp/patcher.pid
          sleep 3
          cat /tmp/patcher.log || true

      - name: Run pyside6-android-deploy
        run: |
          set -o pipefail
          source $HOME/venv/bin/activate

          WHEEL_PYSIDE="wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          WHEEL_SHIBOKEN="wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"

          set +e
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shbokken "$WHEEL_SHIBOKEN" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --sdk-path "$ANDROID_HOME" \
            2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: Post-deploy diagnostics
        if: always()
        run: |
          set +e
          cat /tmp/patcher.log || echo "无 patcher 日志"

          echo "======== deploy 后 qt bootstrap 的 Java 补丁状态 ========"
          QT_JAVA=$(find / -path "*bootstraps/qt*" -name "PythonActivity.java" -type f 2>/dev/null | head -1)
          if [ -n "$QT_JAVA" ]; then
            echo "目标: $QT_JAVA"
            grep -A 12 "qtInitOnCreate" "$QT_JAVA" | head -14 || echo "❌ 未找到补丁"
          fi

          [ -f "$GITHUB_WORKSPACE/build.log" ] && tail -50 "$GITHUB_WORKSPACE/build.log" || true

      - name: Stop background p4a patcher
        if: always()
        run: |
          if [ -f /tmp/patcher.pid ]; then
            kill "$(cat /tmp/patcher.pid)" 2>/dev/null || true
          fi
          cat /tmp/patcher.log || true

      - name: Collect APK artifacts
        if: always()
        run: |
          set +e
          mkdir -p dist
          find . -type f -name "*.apk" \
            -not -path "./dist/*" \
            -not -path "./.buildozer/*" \
            -not -path "./python-for-android/*" \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist/

      - name: Verify APK contents
        if: always()
        run: |
          set +e
          APK=$(find dist -name "*.apk" | head -1)
          [ -z "$APK" ] && { echo "无 APK"; exit 0; }

          echo "=== libpython ==="
          unzip -l "$APK" | grep -E "libpython|libshiboken" || true

          echo "=== dex 中 qtInitOnCreate 标记 ==="
          mkdir -p /tmp/apkcheck_dex
          unzip -o "$APK" "classes*.dex" -d /tmp/apkcheck_dex 2>/dev/null || true
          strings /tmp/apkcheck_dex/classes*.dex | grep -E "qtInitOnCreate|QtInitPatch|setActivity" | head -10 && \
            echo "✅ dex 含 Qt 初始化标记" || echo "❌ dex 无标记"

          echo "=== MANAGE_EXTERNAL_STORAGE ==="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | head -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump permissions "$APK" 2>/dev/null | grep -i "MANAGE_EXTERNAL_STORAGE" && \
              echo "✅ 权限已注入" || echo "❌ 权限未注入"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            /tmp/patcher.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
