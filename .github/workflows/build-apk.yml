# .github/workflows/build-apk.yml
#
# 完整版：v3，包含：
#   - PySide6 6.9.2 + cp311 wheel
#   - NDK r27c（Qt 6.9.2 硬性要求，不可降级）
#   - JDK 17 + JAXB 注入
#   - 预克隆 p4a + 双位置补丁（Python 版本 + JNI 修复）
#   - 后台 patcher：监控 recipe + manifest，实时拦截 3.14 和权限缺失
#   - APK 产物验证：libpython3.11.so + MANAGE_EXTERNAL_STORAGE
#
# 拆分说明：
#   所有超过 10 行的 shell 逻辑已抽到 .github/scripts/ 下，
#   本文件只保留 step 声明和一行调用。

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.9.2'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_BUILD_TOOLS: '33.0.2'
  ANDROID_HOME: /usr/local/lib/android/sdk
  TARGET_PYTHON: '3.11.5'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ============================================================
      # venv（经验 22：必须 GITHUB_ENV + GITHUB_PATH 双写）
      # ============================================================
      - name: Create and activate venv
        run: bash .github/scripts/setup-env.sh venv

      # ============================================================
      # JDK 17（经验 9：统一 JDK 17 + JAXB）
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: bash .github/scripts/setup-env.sh verify-java

      # ============================================================
      # cmdline-tools 手动安装（经验 52：不用 setup-android）
      # ============================================================
      - name: Manually install Android cmdline-tools
        run: bash .github/scripts/setup-env.sh cmdline-tools

      # ============================================================
      # JAXB 注入（经验 8 + 23：必须显式写进 CLASSPATH）
      # ============================================================
      - name: Ensure JAXB in sdkmanager CLASSPATH
        run: bash .github/scripts/setup-env.sh jaxb

      # ============================================================
      # legacy 软链接（经验 10）
      # ============================================================
      - name: Create legacy sdkmanager symlinks
        run: bash .github/scripts/setup-env.sh symlinks

      - name: Verify sdkmanager works
        run: bash .github/scripts/setup-env.sh verify-sdkmanager

      - name: Install Android SDK components
        run: bash .github/scripts/setup-env.sh sdk-components

      # ============================================================
      # NDK r27c（经验 1：Qt 6.9.2 硬性要求）
      # ============================================================
      - name: Install Android NDK r27c
        run: bash .github/scripts/setup-env.sh ndk

      - name: Export NDK env
        run: bash .github/scripts/setup-env.sh export-ndk

      # ============================================================
      # 系统依赖（经验 11：libffi/autoconf 必需）
      # ============================================================
      - name: Install system dependencies
        run: bash .github/scripts/setup-env.sh system-deps

      # ============================================================
      # PySide6 及工具链（经验 7：隐藏依赖主动装）
      # ============================================================
      - name: Install PySide6 and deploy tools in venv
        run: bash .github/scripts/setup-env.sh pyside

      # ============================================================
      # 下载 Android wheel（经验 5：wget 直连 Qt 官方镜像）
      # ============================================================
      - name: Download Android Wheels
        run: bash .github/scripts/setup-env.sh wheels

      - name: Sanity check project layout
        run: bash .github/scripts/setup-env.sh sanity-check

      # ============================================================
      # 下载 Python 3.11.5 源码包并计算校验和（经验 4：改 recipe 必须覆盖 md5/sha）
      # ============================================================
      - name: Download Python ${{ env.TARGET_PYTHON }} and compute checksums
        run: bash .github/scripts/setup-env.sh python-checksum

      # ============================================================
      # 预克隆 p4a + 初始补丁（recipe + JNI + manifest）
      # ============================================================
      - name: Pre-clone p4a to both locations and patch
        run: bash .github/scripts/patch-p4a.sh patch

      # ============================================================
      # 修改 buildozer default.spec
      # ============================================================
      - name: Patch buildozer default.spec to use our p4a
        run: bash .github/scripts/patch-buildozer-spec.sh

      # ============================================================
      # 清理构建缓存
      # ============================================================
      - name: Clean p4a build cache
        run: bash .github/scripts/patch-p4a.sh clean-cache

      # ============================================================
      # 后台 patcher：监控 recipe + manifest
      # ============================================================
      - name: Start background p4a patcher
        run: |
          nohup bash .github/scripts/p4a-patcher.sh > /dev/null 2>&1 &
          echo $! > /tmp/patcher.pid
          sleep 3
          cat /tmp/patcher.log || true

      # ============================================================
      # 运行 deploy
      # ============================================================
      - name: Run pyside6-android-deploy
        run: bash .github/scripts/run-deploy.sh

      # ============================================================
      # 运行后诊断（经验 12：find 加 || true）
      # ============================================================
      - name: Post-deploy diagnostics
        if: always()
        run: bash .github/scripts/collect-diagnostics.sh post-deploy

      # ============================================================
      # 停止 patcher
      # ============================================================
      - name: Stop background p4a patcher
        if: always()
        run: bash .github/scripts/collect-diagnostics.sh stop-patcher

      # ============================================================
      # 收集 APK（经验 12）
      # ============================================================
      - name: Collect APK artifacts
        if: always()
        run: bash .github/scripts/collect-diagnostics.sh collect-apk

      - name: List project root files for debugging
        if: always()
        run: bash .github/scripts/collect-diagnostics.sh list-root

      # ============================================================
      # 验证 APK 内容（经验 17：日志不可信，以产物为准）
      # ============================================================
      - name: Verify APK contents
        if: always()
        run: bash .github/scripts/verify-apk.sh

      # ============================================================
      # 上传产物（经验 13：if-no-files-found 显式设置）
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log and patcher log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            /tmp/patcher.log
            .buildozer/**/build.log
            .buildozer/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
