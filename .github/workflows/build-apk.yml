name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.9.2'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '33.0.2'
  ANDROID_HOME: /usr/local/lib/android/sdk
  TARGET_PYTHON: '3.11.5'

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv
        run: |
          python -m venv $HOME/venv
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          source $HOME/venv/bin/activate
          python --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R $USER:$USER "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Ensure JAXB + legacy symlinks
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          LIBDIR="$ANDROID_HOME/cmdline-tools/latest/lib"
          mkdir -p "$LIBDIR"
          cd "$LIBDIR"
          wget -q https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/com/sun/xml/bind/jaxb-impl/2.3.1/jaxb-impl-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0/jaxb-core-2.3.0.jar
          wget -q https://repo1.maven.org/maven2/javax/activation/javax.activation-api/1.2.0/javax.activation-api-1.2.0.jar
          if ! grep -q "jaxb-api-2.3.1" "$SDKMGR"; then
            sed -i "s|^CLASSPATH=\"|CLASSPATH=\"$LIBDIR/jaxb-api-2.3.1.jar:$LIBDIR/jaxb-impl-2.3.1.jar:$LIBDIR/jaxb-core-2.3.0.jar:$LIBDIR/javax.activation-api-1.2.0.jar:|" "$SDKMGR"
          fi
          mkdir -p "$ANDROID_HOME/tools/bin" "$ANDROID_HOME/cmdline-tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/cmdline-tools/bin/avdmanager"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK + NDK r26b
        run: |
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" || true
          yes | sdkmanager --licenses || true
          yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" || (echo "NDK 安装失败" && exit 1)

      - name: Export env vars (覆盖 runner 预装 NDK)
        run: |
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool \
            libssl-dev make patch patchelf pkg-config \
            python3 python3-dev python3-pip python3-venv \
            unzip wget zip

      - name: Install PySide6 and tools
        run: |
          source $HOME/venv/bin/activate
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}" "shiboken6==${PYSIDE_VERSION}"
          pip install packaging jinja2 pkginfo tqdm
          pip install buildozer cython virtualenv

      - name: Download Android Wheels
        run: |
          mkdir -p wheels
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -lh wheels/

      - name: Sanity check
        run: |
          for f in main.py pysidedeploy.spec core qml qml/main.qml; do
            test -e "$f" || (echo "缺少 $f" && exit 1)
          done

      - name: Download Python and compute checksums
        run: |
          cd /tmp
          wget -q "https://www.python.org/ftp/python/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz"
          MD5=$(md5sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')
          SHA256=$(sha256sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')
          echo "PY_TARBALL_MD5=$MD5" >> "$GITHUB_ENV"
          echo "PY_TARBALL_SHA256=$SHA256" >> "$GITHUB_ENV"

      # ============================================================
      # 预克隆 p4a + 初始补丁
      #   1. python3/hostpython3 recipe 版本改为 3.11.5
      #   2. PythonActivity.java 提前加载 Qt6Core
      #   3. 给 python3 recipe 追加 prebuild hook（用 echo 逐行写入，
      #      避免 heredoc 破坏 YAML 缩进）
      # ============================================================
      - name: Pre-clone p4a and patch
        run: |
          set -e
          P4A="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          rm -rf "$GITHUB_WORKSPACE/.buildozer"
          mkdir -p "$(dirname "$P4A")"
          git clone -b develop --single-branch https://github.com/kivy/python-for-android.git "$P4A"

          # ---- 1. recipe 版本 ----
          for R in python3 hostpython3; do
            RF="$P4A/pythonforandroid/recipes/$R/__init__.py"
            [ -f "$RF" ] || continue
            sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)['\"]3\.[0-9]+\.[0-9]+['\"]/\1'${TARGET_PYTHON}'/" "$RF"
            sed -i -E "s/^([[:space:]]*md5sum[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_MD5}'/" "$RF"
            sed -i -E "s/^([[:space:]]*sha256[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_SHA256}'/" "$RF"
            sed -i -E "s|/3\.14\.[0-9]+/Python-3\.14\.[0-9]+\.tar\.xz|/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz|g" "$RF"
          done

          # ---- 2. PythonActivity.java ----
          find "$P4A/pythonforandroid/bootstraps" -name "PythonActivity.java" -type f 2>/dev/null | while IFS= read -r JF; do
            if ! grep -q "loadQt6CoreFirst" "$JF"; then
              sed -i '/^public class PythonActivity/a\
          /* loadQt6CoreFirst */ static { try { String abi = android.os.Build.SUPPORTED_ABIS[0]; System.loadLibrary("Qt6Core_" + abi); } catch (Throwable t) { t.printStackTrace(); } }' "$JF"
            fi
          done

          # ---- 3. python3 recipe prebuild hook（逐行 echo，绝对安全的 YAML）----
          P3_RECIPE="$P4A/pythonforandroid/recipes/python3/__init__.py"
          if ! grep -q "_p4a_android_prebuild" "$P3_RECIPE"; then
            echo "" >> "$P3_RECIPE"
            echo "# ===== Android Python 3.11.5 fix =====" >> "$P3_RECIPE"
            echo "import os as _p4a_os" >> "$P3_RECIPE"
            echo "import subprocess as _p4a_sp" >> "$P3_RECIPE"
            echo "" >> "$P3_RECIPE"
            echo "_p4a_orig_prebuild = getattr(Python3Recipe, 'prebuild_arch', None)" >> "$P3_RECIPE"
            echo "" >> "$P3_RECIPE"
            echo "def _p4a_android_prebuild(self, arch):" >> "$P3_RECIPE"
            echo "    if _p4a_orig_prebuild is not None:" >> "$P3_RECIPE"
            echo "        _p4a_orig_prebuild(self, arch)" >> "$P3_RECIPE"
            echo "    try:" >> "$P3_RECIPE"
            echo "        bd = self.get_build_dir(arch.arch)" >> "$P3_RECIPE"
            echo "        cfg = _p4a_os.path.join(bd, 'configure')" >> "$P3_RECIPE"
            echo "        if _p4a_os.path.exists(cfg):" >> "$P3_RECIPE"
            echo "            _p4a_sp.call(['sed', '-i', 's/-Werror=implicit-function-declaration//g', cfg])" >> "$P3_RECIPE"
            echo "            print('[p4a-fix] patched configure: ' + cfg)" >> "$P3_RECIPE"
            echo "    except Exception as e:" >> "$P3_RECIPE"
            echo "        print('[p4a-fix] failed: ' + str(e))" >> "$P3_RECIPE"
            echo "" >> "$P3_RECIPE"
            echo "Python3Recipe.prebuild_arch = _p4a_android_prebuild" >> "$P3_RECIPE"
            echo "hook 已追加"
          else
            echo "hook 已存在，跳过"
          fi

      - name: Patch default.spec
        run: |
          source $HOME/venv/bin/activate
          DS="$VIRTUAL_ENV/lib/python3.11/site-packages/buildozer/default.spec"
          P4A="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          if grep -q "^p4a.source_dir" "$DS"; then
            sed -i "s|^p4a.source_dir.*|p4a.source_dir = ${P4A}|" "$DS"
          else
            sed -i "/^\[buildozer\]/a p4a.source_dir = ${P4A}" "$DS"
          fi

      # ============================================================
      # 后台 patcher：cat > 生成的 shell 脚本，用统一缩进
      # patcher 内部也用 echo 逐行追加 hook，避免嵌套 heredoc
      # ============================================================
      - name: Start background patcher
        run: |
          : > /tmp/patcher.sh
          echo '#!/bin/bash' >> /tmp/patcher.sh
          echo 'LOG=/tmp/patcher.log' >> /tmp/patcher.sh
          echo 'echo "start $(date)" > $LOG' >> /tmp/patcher.sh
          echo 'TARGET_PY="$TARGET_PYTHON"' >> /tmp/patcher.sh
          echo 'TARBALL="/tmp/Python-${TARGET_PY}.tar.xz"' >> /tmp/patcher.sh
          echo 'if [ -f "$TARBALL" ]; then MD5=$(md5sum "$TARBALL" | awk "{print \$1}"); SHA256=$(sha256sum "$TARBALL" | awk "{print \$1}"); else MD5=""; SHA256=""; fi' >> /tmp/patcher.sh
          echo 'while true; do' >> /tmp/patcher.sh
          echo '  for P4A in "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android" "$HOME/.buildozer/android/platform/python-for-android"; do' >> /tmp/patcher.sh
          echo '    [ -d "$P4A" ] || continue' >> /tmp/patcher.sh
          echo '    for R in python3 hostpython3; do' >> /tmp/patcher.sh
          echo '      F="$P4A/pythonforandroid/recipes/$R/__init__.py"' >> /tmp/patcher.sh
          echo '      if [ -f "$F" ] && grep -qE "version = .3\.14\." "$F"; then' >> /tmp/patcher.sh
          echo '        sed -i -E "s/version = .3\.[0-9]+\.[0-9]+./version = \"$TARGET_PY\"/" "$F"' >> /tmp/patcher.sh
          echo '        [ -n "$MD5" ] && sed -i -E "s/md5sum = .[a-fA-F0-9]+./md5sum = \"$MD5\"/" "$F"' >> /tmp/patcher.sh
          echo '        [ -n "$SHA256" ] && sed -i -E "s/sha256 = .[a-fA-F0-9]+./sha256 = \"$SHA256\"/" "$F"' >> /tmp/patcher.sh
          echo '        echo "$(date) recipe $F" >> $LOG' >> /tmp/patcher.sh
          echo '      fi' >> /tmp/patcher.sh
          echo '    done' >> /tmp/patcher.sh
          echo '    P3="$P4A/pythonforandroid/recipes/python3/__init__.py"' >> /tmp/patcher.sh
          echo '    if [ -f "$P3" ] && ! grep -q "_p4a_android_prebuild" "$P3"; then' >> /tmp/patcher.sh
          echo '      echo "" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "# ===== Android Python 3.11.5 fix =====" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "import os as _p4a_os" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "import subprocess as _p4a_sp" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "_p4a_orig_prebuild = getattr(Python3Recipe, '"'"'prebuild_arch'"'"', None)" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "def _p4a_android_prebuild(self, arch):" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "    if _p4a_orig_prebuild is not None:" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "        _p4a_orig_prebuild(self, arch)" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "    try:" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "        bd = self.get_build_dir(arch.arch)" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "        cfg = _p4a_os.path.join(bd, '"'"'configure'"'"')" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "        if _p4a_os.path.exists(cfg):" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "            _p4a_sp.call(['"'"'sed'"'"', '"'"'-i'"'"', '"'"'s/-Werror=implicit-function-declaration//g'"'"', cfg])" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "            print('"'"'[p4a-fix] patched configure: '"'"' + cfg)" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "    except Exception as e:" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "        print('"'"'[p4a-fix] failed: '"'"' + str(e))" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "Python3Recipe.prebuild_arch = _p4a_android_prebuild" >> "$P3"' >> /tmp/patcher.sh
          echo '      echo "$(date) hook $P3" >> $LOG' >> /tmp/patcher.sh
          echo '    fi' >> /tmp/patcher.sh
          echo '    find "$P4A/pythonforandroid/bootstraps" -name "PythonActivity.java" -type f 2>/dev/null | while IFS= read -r F; do' >> /tmp/patcher.sh
          echo '      if ! grep -q "loadQt6CoreFirst" "$F"; then' >> /tmp/patcher.sh
          echo '        sed -i "/^public class PythonActivity/a\\/* loadQt6CoreFirst */ static { try { String abi = android.os.Build.SUPPORTED_ABIS[0]; System.loadLibrary(\\"Qt6Core_\\" + abi); } catch (Throwable t) { t.printStackTrace(); } }" "$F"' >> /tmp/patcher.sh
          echo '        echo "$(date) activity $F" >> $LOG' >> /tmp/patcher.sh
          echo '      fi' >> /tmp/patcher.sh
          echo '    done' >> /tmp/patcher.sh
          echo '  done' >> /tmp/patcher.sh
          echo '  sleep 1' >> /tmp/patcher.sh
          echo 'done' >> /tmp/patcher.sh
          chmod +x /tmp/patcher.sh
          nohup /tmp/patcher.sh > /dev/null 2>&1 &
          echo "$!" > /tmp/patcher.pid
          sleep 2
          echo "=== Patcher 启动日志 ==="
          cat /tmp/patcher.log || true

      # ============================================================
      # 核心构建
      # ============================================================
      - name: Run pyside6-android-deploy
        if: always()
        run: |
          source $HOME/venv/bin/activate
          WHEEL_PYSIDE="wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          WHEEL_SHIBOKEN="wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"

          set +e
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shiboken "$WHEEL_SHIBOKEN" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --sdk-path "$ANDROID_HOME" \
            > /tmp/deploy_raw.log 2>&1
          EXIT_CODE=$?
          set -e

          sed 's/\x1b\[[0-9;]*m//g' /tmp/deploy_raw.log > "$GITHUB_WORKSPACE/build.log"
          echo "退出码: $EXIT_CODE"

      - name: Stop patcher
        if: always()
        run: |
          [ -f /tmp/patcher.pid ] && kill "$(cat /tmp/patcher.pid)" 2>/dev/null || true
          echo "=== Patcher 日志 ==="
          cat /tmp/patcher.log || true

      # ============================================================
      # 诊断
      # ============================================================
      - name: Diagnostics
        if: always()
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/build.log" ]; then
            echo "无 build.log"
            exit 0
          fi

          echo "=== 1. [p4a-fix] hook 是否被调用 ==="
          grep -n "p4a-fix" "$GITHUB_WORKSPACE/build.log" | tail -10 || echo "hook 未被调用"

          echo ""
          echo "=== 2. [ERROR] ==="
          grep -n '\[ERROR\]' "$GITHUB_WORKSPACE/build.log" | tail -10 || echo "无 [ERROR]"

          echo ""
          echo "=== 3. 真正的编译错误（过滤 -Werror 干扰）==="
          grep -nE ': error: |make(\[[0-9]+\])?: \*\*\*' "$GITHUB_WORKSPACE/build.log" | grep -v "implicit-function-declaration" | tail -20 || echo "无"

          echo ""
          echo "=== 4. grpmodule.c 是否还报错 ==="
          grep -n "grpmodule.c" "$GITHUB_WORKSPACE/build.log" | tail -5 || echo "grpmodule.c 无报错（说明补丁生效）"

          echo ""
          echo "=== 5. gradle 失败位置 ==="
          grep -n "gradlew failed" "$GITHUB_WORKSPACE/build.log" | head -3 || echo "无 gradle 失败"

          echo ""
          echo "=== 6. gradle 之前 80 行 ==="
          FAIL_LINE=$(grep -n "gradlew failed" "$GITHUB_WORKSPACE/build.log" | head -1 | cut -d: -f1)
          if [ -n "$FAIL_LINE" ]; then
            START=$((FAIL_LINE - 80))
            [ "$START" -lt 1 ] && START=1
            sed -n "${START},${FAIL_LINE}p" "$GITHUB_WORKSPACE/build.log"
          fi

          echo ""
          echo "=== 7. Traceback ==="
          grep -nE 'Traceback|RuntimeError|CalledProcessError' "$GITHUB_WORKSPACE/build.log" | tail -10 || echo "无"

      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist
          find /home/runner -type f -name "*.apk" 2>/dev/null | tee /tmp/apk_list.txt || true
          if [ -s /tmp/apk_list.txt ]; then
            while IFS= read -r apk; do
              case "$apk" in
                */android/sdk/*) continue ;;
                */cmdline-tools/*) continue ;;
                */ndk/*) continue ;;
              esac
              cp "$apk" dist/ 2>/dev/null && echo "复制: $apk"
            done < /tmp/apk_list.txt
          fi
          ls -lh dist/ 2>/dev/null || echo "dist/ 为空"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            /tmp/patcher.log
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
