# .github/workflows/build-apk.yml
#
# 关键修复（本版）：
#   - buildozer 会强制重新 clone p4a，覆盖所有预打的补丁
#   - 因此改为「后台持续监控 + 实时重新打补丁」策略
#   - 监控目标：python3 recipe / hostpython3 recipe / PythonActivity.java / 所有 bootstrap 的 AndroidManifest.tmpl.xml
#   - 监控间隔 0.5 秒，一旦发现被覆盖立即打回
#
# 历史修复保留：
#   - NDK 降级到 r26b
#   - PythonActivity.java 提前加载 Qt6Core（解决 JNI_OnLoad SIGSEGV）
#   - AndroidManifest 注入 MANAGE_EXTERNAL_STORAGE（解决存储权限）

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.9.2'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '33.0.2'
  ANDROID_HOME: /usr/local/lib/android/sdk
  TARGET_PYTHON: '3.11.5'

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv
        run: |
          python -m venv $HOME/venv
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          source $HOME/venv/bin/activate
          python --version
          pip --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R $USER:$USER "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Ensure JAXB in sdkmanager CLASSPATH + legacy symlinks
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          LIBDIR="$ANDROID_HOME/cmdline-tools/latest/lib"
          mkdir -p "$LIBDIR"
          cd "$LIBDIR"
          wget -q https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/com/sun/xml/bind/jaxb-impl/2.3.1/jaxb-impl-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0/jaxb-core-2.3.0.jar
          wget -q https://repo1.maven.org/maven2/javax/activation/javax.activation-api/1.2.0/javax.activation-api-1.2.0.jar
          if ! grep -q "jaxb-api-2.3.1" "$SDKMGR"; then
            sed -i "s|^CLASSPATH=\"|CLASSPATH=\"$LIBDIR/jaxb-api-2.3.1.jar:$LIBDIR/jaxb-impl-2.3.1.jar:$LIBDIR/jaxb-core-2.3.0.jar:$LIBDIR/javax.activation-api-1.2.0.jar:|" "$SDKMGR"
          fi
          mkdir -p "$ANDROID_HOME/tools/bin" "$ANDROID_HOME/cmdline-tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/cmdline-tools/bin/avdmanager"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Verify sdkmanager
        run: |
          which sdkmanager
          sdkmanager --version

      - name: Install Android SDK + NDK r26b
        run: |
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" || true
          yes | sdkmanager --licenses || true
          yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" || (echo "NDK 安装失败" && exit 1)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool \
            libssl-dev make patch patchelf pkg-config \
            python3 python3-dev python3-pip python3-venv \
            unzip wget zip

      - name: Install PySide6 and deploy tools
        run: |
          source $HOME/venv/bin/activate
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}" "shiboken6==${PYSIDE_VERSION}"
          pip install packaging jinja2 pkginfo tqdm
          pip install buildozer cython virtualenv
          pip list | grep -i -E "pyside|shiboken|buildozer"
          which pyside6-android-deploy

      - name: Download Android Wheels
        run: |
          mkdir -p wheels
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -lh wheels/

      - name: Sanity check project layout
        run: |
          for f in main.py pysidedeploy.spec core qml qml/main.qml; do
            test -e "$f" || (echo "缺少 $f" && exit 1)
          done
          echo "项目结构 OK"

      - name: Download Python ${{ env.TARGET_PYTHON }} and compute checksums
        run: |
          cd /tmp
          wget -q "https://www.python.org/ftp/python/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz"
          MD5=$(md5sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')
          SHA256=$(sha256sum "Python-${TARGET_PYTHON}.tar.xz" | awk '{print $1}')
          echo "PY_TARBALL_MD5=$MD5" >> "$GITHUB_ENV"
          echo "PY_TARBALL_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "MD5=$MD5"
          echo "SHA256=$SHA256"

      - name: Pre-clone p4a and initial patch
        run: |
          set -e
          P4A_A="$GITHUB_WORKSPACE/python-for-android"
          P4A_B="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          rm -rf "$P4A_A" "$GITHUB_WORKSPACE/.buildozer"
          mkdir -p "$(dirname "$P4A_B")"

          echo "======== Clone p4a ========"
          git clone -b develop --single-branch https://github.com/kivy/python-for-android.git "$P4A_A"
          cp -r "$P4A_A" "$P4A_B"

          echo "======== 初始打补丁（防御性）========"
          for P4A in "$P4A_A" "$P4A_B"; do
            # Python recipe
            for R in python3 hostpython3; do
              RF="$P4A/pythonforandroid/recipes/$R/__init__.py"
              if [ -f "$RF" ]; then
                sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)['\"]3\.[0-9]+\.[0-9]+['\"]/\1'${TARGET_PYTHON}'/" "$RF"
                sed -i -E "s/^([[:space:]]*md5sum[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_MD5}'/" "$RF"
                sed -i -E "s/^([[:space:]]*sha256[[:space:]]*=[[:space:]]*)['\"][a-fA-F0-9]+['\"]/\1'${PY_TARBALL_SHA256}'/" "$RF"
                sed -i -E "s|/3\.14\.[0-9]+/Python-3\.14\.[0-9]+\.tar\.xz|/${TARGET_PYTHON}/Python-${TARGET_PYTHON}.tar.xz|g" "$RF"
              fi
            done

            # PythonActivity.java（所有 bootstrap）
            find "$P4A/pythonforandroid/bootstraps" -name "PythonActivity.java" -type f 2>/dev/null | while read -r JF; do
              if [ -f "$JF" ] && ! grep -q "loadQt6CoreFirst" "$JF"; then
                sed -i '/^public class PythonActivity/a\
/* loadQt6CoreFirst */\
static {\
    try {\
        String abi = android.os.Build.SUPPORTED_ABIS[0];\
        System.loadLibrary("Qt6Core_" + abi);\
    } catch (Throwable t) {\
        t.printStackTrace();\
    }\
}' "$JF"
              fi
            done

            # AndroidManifest.tmpl.xml（所有 bootstrap）
            find "$P4A/pythonforandroid/bootstraps" -name "AndroidManifest.tmpl.xml" -type f 2>/dev/null | while read -r MF; do
              if [ -f "$MF" ] && ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MF"; then
                awk '
                  /<application/ && !done {
                    print "    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />";
                    print "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />";
                    print "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />";
                    done=1
                  }
                  { print }
                ' "$MF" > "${MF}.new" && mv "${MF}.new" "$MF"
              fi
            done
          done

          echo "======== 验证 ========"
          grep -nE "version = " "$P4A_A/pythonforandroid/recipes/python3/__init__.py" | head -3
          echo "--- MANAGE_EXTERNAL_STORAGE 数量 ---"
          grep -rl "MANAGE_EXTERNAL_STORAGE" "$P4A_A/pythonforandroid/bootstraps" 2>/dev/null | head -5
          echo "--- loadQt6CoreFirst 数量 ---"
          grep -rl "loadQt6CoreFirst" "$P4A_A/pythonforandroid/bootstraps" 2>/dev/null | head -5

      - name: Patch buildozer default.spec
        run: |
          source $HOME/venv/bin/activate
          DS="$VIRTUAL_ENV/lib/python3.11/site-packages/buildozer/default.spec"
          P4A_B="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          if grep -q "^p4a.source_dir" "$DS"; then
            sed -i "s|^p4a.source_dir.*|p4a.source_dir = ${P4A_B}|" "$DS"
          else
            sed -i "/^\[buildozer\]/a p4a.source_dir = ${P4A_B}" "$DS"
          fi
          echo "=== default.spec [buildozer] 段 ==="
          grep -A 10 "^\[buildozer\]" "$DS" || true

      - name: Clean p4a build cache
        run: |
          PLATFORM_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform"
          find "$PLATFORM_DIR" -maxdepth 1 -type d -name "build-*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/dists" 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/build" 2>/dev/null || true
          rm -rf "$PLATFORM_DIR/python-for-android/.buildozer" 2>/dev/null || true
          echo "缓存清理完成"

      # ============================================================
      # 【本版核心】后台持续监控 + 实时重新打补丁
      #   buildozer 会强制重新 clone p4a，覆盖预打的补丁
      #   监控脚本每 0.5 秒检测一次，发现被覆盖立即打回
      # ============================================================
      - name: Start background p4a patcher (watchdog mode)
        run: |
          PATCHER="$GITHUB_WORKSPACE/p4a_patcher.sh"
          cat > "$PATCHER" <<'PATCHER_EOF'
#!/bin/bash
LOG="/tmp/patcher.log"
PY="3.11.5"
TARBALL="/tmp/Python-${PY}.tar.xz"
if [ -f "$TARBALL" ]; then
  MD5=$(md5sum "$TARBALL" | awk '{print $1}')
  SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
else
  MD5=""
  SHA256=""
fi
echo "[Patcher] start $(date), PY=$PY, MD5=$MD5, SHA256=$SHA256" > "$LOG"

patch_recipe() {
  local F="$1"
  [ -f "$F" ] || return
  if grep -qE "version = '3\.14\.|version = \"3\.14\." "$F"; then
    sed -i -E "s/version = '3\.[0-9]+\.[0-9]+'/version = '$PY'/" "$F"
    sed -i -E "s/version = \"3\.[0-9]+\.[0-9]+\"/version = '$PY'/" "$F"
    [ -n "$MD5" ] && sed -i -E "s/md5sum = '[a-fA-F0-9]+'/md5sum = '$MD5'/" "$F"
    [ -n "$SHA256" ] && sed -i -E "s/sha256 = '[a-fA-F0-9]+'/sha256 = '$SHA256'/" "$F"
    echo "[Patcher] $(date) patched recipe: $F" >> "$LOG"
  fi
}

patch_activity() {
  local F="$1"
  [ -f "$F" ] || return
  grep -q "loadQt6CoreFirst" "$F" && return
  sed -i '/^public class PythonActivity/a\
/* loadQt6CoreFirst */\
static {\
    try {\
        String abi = android.os.Build.SUPPORTED_ABIS[0];\
        System.loadLibrary("Qt6Core_" + abi);\
    } catch (Throwable t) {\
        t.printStackTrace();\
    }\
}' "$F"
  echo "[Patcher] $(date) patched activity: $F" >> "$LOG"
}

patch_manifest() {
  local F="$1"
  [ -f "$F" ] || return
  grep -q "MANAGE_EXTERNAL_STORAGE" "$F" && return
  awk '
    /<application/ && !done {
      print "    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />";
      print "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />";
      print "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />";
      done=1
    }
    { print }
  ' "$F" > "${F}.new" && mv "${F}.new" "$F"
  echo "[Patcher] $(date) patched manifest: $F" >> "$LOG"
}

while true; do
  for P4A_DIR in \
    "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android" \
    "$GITHUB_WORKSPACE/python-for-android" \
    "$HOME/.buildozer/android/platform/python-for-android" ; do
    [ -d "$P4A_DIR" ] || continue

    patch_recipe "$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"
    patch_recipe "$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py"

    find "$P4A_DIR/pythonforandroid/bootstraps" -name "PythonActivity.java" -type f 2>/dev/null | while IFS= read -r F; do
      patch_activity "$F"
    done

    find "$P4A_DIR/pythonforandroid/bootstraps" -name "AndroidManifest.tmpl.xml" -type f 2>/dev/null | while IFS= read -r F; do
      patch_manifest "$F"
    done
  done
  sleep 0.5
done
PATCHER_EOF
          chmod +x "$PATCHER"
          nohup "$PATCHER" > /dev/null 2>&1 &
          echo "$!" > /tmp/patcher.pid
          echo "Patcher PID: $(cat /tmp/patcher.pid)"
          sleep 2
          echo "=== 启动日志 ==="
          cat /tmp/patcher.log || true

      - name: Run pyside6-android-deploy
        run: |
          set -o pipefail
          source $HOME/venv/bin/activate

          WHEEL_PYSIDE="wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          WHEEL_SHIBOKEN="wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -lh "$WHEEL_PYSIDE" "$WHEEL_SHIBOKEN"

          set +e
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shiboken "$WHEEL_SHIBOKEN" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --sdk-path "$ANDROID_HOME" \
            2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "pyside6-android-deploy 退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: Stop patcher
        if: always()
        run: |
          if [ -f /tmp/patcher.pid ]; then
            kill "$(cat /tmp/patcher.pid)" 2>/dev/null || true
            echo "已停止 Patcher PID: $(cat /tmp/patcher.pid)"
          fi
          echo "=== Patcher 完整日志 ==="
          cat /tmp/patcher.log || true

      - name: Post-deploy diagnostics
        if: always()
        run: |
          echo "=== build.log 末尾 80 行 ==="
          [ -f "$GITHUB_WORKSPACE/build.log" ] && tail -80 "$GITHUB_WORKSPACE/build.log" || echo "无 build.log"

          echo ""
          echo "=== 最终检查补丁状态 ==="
          for P4A_DIR in \
              "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android" \
              "$GITHUB_WORKSPACE/python-for-android" ; do
            echo "---- $P4A_DIR ----"
            if [ -d "$P4A_DIR" ]; then
              grep -nE "^[[:space:]]*version[[:space:]]*=" "$P4A_DIR/pythonforandroid/recipes/python3/__init__.py" 2>/dev/null || echo "recipe 不存在"
              grep -rl "MANAGE_EXTERNAL_STORAGE" "$P4A_DIR/pythonforandroid/bootstraps" 2>/dev/null | head -3 || echo "manifest 未打补丁"
              grep -rl "loadQt6CoreFirst" "$P4A_DIR/pythonforandroid/bootstraps" 2>/dev/null | head -3 || echo "PythonActivity 未打补丁"
            fi
          done

      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist
          find . -type f -name "*.apk" \
            -not -path "./dist/*" \
            -not -path "./.buildozer/*" \
            -not -path "./python-for-android/*" \
            -exec cp {} dist/ \; 2>/dev/null || true
          echo "=== dist/ 内容 ==="
          ls -lh dist/ || echo "dist/ 为空"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            /tmp/patcher.log
          if-no-files-found: warn
          retention-days: 7
