# .github/workflows/build-apk.yml
# 关键设计：
#   - 全程统一使用 JDK 17（这是唯一能同时满足 sdkmanager / avdmanager 的版本）
#   - 手动往 Android cmdline-tools 的 lib 目录注入 JAXB jar，
#     解决 JDK 9+ 移除 javax.xml.bind 导致的 sdkmanager 报错
#   - 不再使用 JDK 8

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.8.2'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '25.2.9519653'
  ANDROID_BUILD_TOOLS: '33.0.2'

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ============================================================
      # 全局统一 JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # ============================================================
      # 安装 PySide6 和构建工具
      # ============================================================
      - name: Install PySide6 and deploy tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}"
          pip install "shiboken6==${PYSIDE_VERSION}"
          pip install packaging jinja2 pkginfo tqdm
          pip install buildozer cython virtualenv
          pip list | grep -i -E "pyside|shiboken|buildozer"

      # ============================================================
      # 下载 Android wheel
      # ============================================================
      - name: Download Android Wheels
        run: |
          mkdir -p wheels
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            -O "wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          ls -lh wheels/

      # ============================================================
      # 配置 Android SDK（此时 JDK 17 已就绪，但 sdkmanager 还会报 JAXB 缺类，
      # 所以下一步先注入 JAXB，再回来执行 sdkmanager 命令）
      # ============================================================
      - name: Set up Android SDK (may emit JAXB warnings, that's OK)
        uses: android-actions/setup-android@v3

      # ============================================================
      # 【关键】下载 JAXB 并注入到 cmdline-tools 的 lib 目录
      # ============================================================
      - name: Install JAXB Library
        run: |
          mkdir -p $HOME/jaxb-libs
          cd $HOME/jaxb-libs
          wget -q https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/com/sun/xml/bind/jaxb-impl/2.3.1/jaxb-impl-2.3.1.jar
          wget -q https://repo1.maven.org/maven2/javax/activation/javax.activation-api/1.2.0/javax.activation-api-1.2.0.jar
          echo "下载完成："
          ls -la

      - name: Inject JAXB into Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # cmdline-tools 可能位于多个版本目录，全部注入
          for d in $ANDROID_HOME/cmdline-tools/*/lib; do
            if [ -d "$d" ]; then
              echo "注入到: $d"
              cp $HOME/jaxb-libs/*.jar "$d/"
            fi
          done
          echo "---- 注入后的 lib 目录 ----"
          ls -la $ANDROID_HOME/cmdline-tools/latest/lib/ | grep -i jaxb || true

      - name: Install Android SDK components
        run: |
          echo "验证 JAXB 注入后 sdkmanager 是否可用..."
          sdkmanager --version
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmdline-tools;latest" || true
          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" || true
          if [ ! -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_ZIP="android-ndk-r25b-linux.zip"
            wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
            sudo mkdir -p /opt/android-ndk
            sudo unzip -q "${NDK_ZIP}" -d /opt/android-ndk
          fi

      - name: Export Android environment variables
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            fi
          else
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

          NDK_CANDIDATE=""
          if [ -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_CANDIDATE="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          elif [ -d "/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_CANDIDATE="/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}"
          elif [ -d "/opt/android-ndk/android-ndk-r25b" ]; then
            NDK_CANDIDATE="/opt/android-ndk/android-ndk-r25b"
          fi

          if [ -n "$NDK_CANDIDATE" ]; then
            echo "ANDROID_NDK_HOME=$NDK_CANDIDATE" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$NDK_CANDIDATE" >> "$GITHUB_ENV"
            echo "Detected NDK at: $NDK_CANDIDATE"
          else
            echo "::error::未能探测到 NDK 路径，停止构建"
            exit 1
          fi

      - name: Sanity check project layout
        run: |
          test -f main.py            || (echo "缺少 main.py" && exit 1)
          test -f pysidedeploy.spec  || (echo "缺少 pysidedeploy.spec" && exit 1)
          test -d core               || (echo "缺少 core/" && exit 1)
          test -d qml                || (echo "缺少 qml/" && exit 1)
          test -f qml/main.qml       || (echo "缺少 qml/main.qml" && exit 1)
          echo "工程结构检查通过"

      # ============================================================
      # 打包（使用 JDK 17）
      # ============================================================
      - name: Run pyside6-android-deploy
        run: |
          set -o pipefail
          echo "======== 当前 JAVA_HOME ========"
          echo "$JAVA_HOME"
          java -version
          echo "================================"

          WHEEL_PYSIDE="wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          WHEEL_SHIBOKEN="wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          echo "使用 PySide wheel: $WHEEL_PYSIDE"
          echo "使用 Shiboken wheel: $WHEEL_SHIBOKEN"

          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shiboken "$WHEEL_SHIBOKEN" \
            --ndk-path "$ANDROID_NDK_HOME" \
            --sdk-path "$ANDROID_HOME" \
            --force 2>&1 | tee build.log

      # ============================================================
      # 收集 APK
      # ============================================================
      - name: Collect APK artifacts
        if: always()
        run: |
          mkdir -p dist
          echo "搜索 APK 文件..."
          find . -type f -name "*.apk" -not -path "./dist/*" | tee apk_list.txt || true

          COUNT=$(wc -l < apk_list.txt)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::未找到任何 APK 产物"
            echo "---- 目录结构 ----"
            find . -maxdepth 4 -type d | head -80
            echo "---- build.log 末尾 ----"
            tail -n 150 build.log || true
            exit 1
          fi

          while IFS= read -r f; do
            [ -f "$f" ] && cp "$f" dist/
          done < apk_list.txt
          ls -lh dist/
          echo "共找到 $COUNT 个 APK 文件"

      - name: Rename APK
        if: always()
        run: |
          cd dist 2>/dev/null || exit 0
          for f in *.apk; do
            [ -f "$f" ] || continue
            case "$f" in
              *arm64-v8a*) NEW="quizassistant-arm64-v8a.apk" ;;
              *armeabi-v7a*) NEW="quizassistant-armeabi-v7a.apk" ;;
              *x86_64*) NEW="quizassistant-x86_64.apk" ;;
              *) NEW="quizassistant-$f" ;;
            esac
            mv "$f" "$NEW" 2>/dev/null || true
          done
          ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            build-*/
            .buildozer/
          retention-days: 7
          if-no-files-found: ignore

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
