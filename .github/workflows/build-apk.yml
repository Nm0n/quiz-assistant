# .github/workflows/build-apk.yml
# GitHub Actions 工作流：云端自动打包 Android APK
#
# 触发方式：
#   - push 到 main 分支
#   - Pull Request（仅构建验证，不发布）
#   - 手动触发（workflow_dispatch）
#
# 产物：
#   - APK 文件作为 artifact 上传（保留 30 天）
#   - 打 tag 时自动创建 Release 并附带 APK

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # 保持与 pysidedeploy.spec 中的 python_version 一致
  PYTHON_VERSION: '3.11'
  PYSIDE_VERSION: '6.8.0'
  # Android 工具链版本（按需调整）
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '25.2.9519653'
  ANDROID_BUILD_TOOLS: '33.0.2'
  ANDROID_CMDLINE_TOOLS: '11076708'
  JDK_VERSION: '17'

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ============================================================
      # 1. 检出代码
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 安装 Python 3.11
      # ============================================================
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python
        run: |
          python --version
          pip --version

      # ============================================================
      # 3. 安装 JDK 17（Android Gradle Plugin 要求）
      # ============================================================
      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}

      - name: Verify Java
        run: java -version

      # ============================================================
      # 4. 安装 PySide6 与 Android 部署工具
      # ============================================================
      - name: Install PySide6 and deploy tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}"
          # Android 打包工具随 PySide6 一并提供
          pip install "shiboken6==${PYSIDE_VERSION}"
          pip install aab
          pip list | grep -i -E "pyside|shiboken"

      # ========== 新增步骤：下载 Android 版本的 wheel ==========
      - name: Download Android Wheels
        run: |
          mkdir -p wheels
          # 使用 qtpip 下载对应架构的 PySide6 和 shiboken6 wheel
          pip install qtpip
          qtpip download PySide6 --android --arch aarch64 -d ./wheels
          qtpip download shiboken6 --android --arch aarch64 -d ./wheels
          echo "下载的 wheel 文件："
          ls -la wheels/


      # ============================================================
      # 5. 缓存 Android SDK / NDK / 下载目录
      #    （大幅缩短重复构建时间）
      # ============================================================
      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/android-sdk
            ${{ runner.tool_cache }}/android-ndk
          key: android-sdk-${{ env.ANDROID_SDK_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-v1

      # ============================================================
      # 6. 配置 Android SDK 与 NDK
      # ============================================================
      - name: Set up Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          sdkmanager --version
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmdline-tools;latest"
          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          # 尝试复用 setup-android 提供的 sdkmanager
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          else
            # 回退：直接下载 NDK 压缩包
            NDK_ZIP="android-ndk-r25b-linux.zip"
            wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
            sudo mkdir -p /opt/android-ndk
            sudo unzip -q "${NDK_ZIP}" -d /opt/android-ndk
          fi

      - name: Export Android environment variables
        run: |
          # 优先使用 setup-android 安装的位置
          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

          # NDK 路径探测
          NDK_CANDIDATE=""
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_CANDIDATE="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          elif [ -d "/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_CANDIDATE="/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}"
          elif [ -d "/opt/android-ndk/android-ndk-r25b" ]; then
            NDK_CANDIDATE="/opt/android-ndk/android-ndk-r25b"
          fi

          if [ -n "$NDK_CANDIDATE" ]; then
            echo "ANDROID_NDK_HOME=$NDK_CANDIDATE" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$NDK_CANDIDATE" >> "$GITHUB_ENV"
            echo "Detected NDK at: $NDK_CANDIDATE"
          else
            echo "::warning::未能自动探测到 NDK 路径，打包可能失败"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_HOME" || true
          which sdkmanager || true
          python -c "from PySide6 import __version__; print('PySide6', __version__)"

      # ============================================================
      # 7. 预检：确认工程结构与 spec 存在
      # ============================================================
      - name: Sanity check project layout
        run: |
          test -f main.py            || (echo "缺少 main.py" && exit 1)
          test -f pysidedeploy.spec  || (echo "缺少 pysidedeploy.spec" && exit 1)
          test -d core               || (echo "缺少 core/" && exit 1)
          test -d qml                || (echo "缺少 qml/" && exit 1)
          test -f qml/main.qml       || (echo "缺少 qml/main.qml" && exit 1)
          echo "工程结构检查通过"

      # ============================================================
      # 8. 执行 Android 打包
      # ============================================================
      - name: Run pyside6-android-deploy
        run: |
          set -o pipefail
          # 使用 spec 中的配置；--force 保证在 CI 上重复执行时清理旧产物
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --force 2>&1 | tee build.log

      # ============================================================
      # 9. 定位并整理 APK 产物
      # ============================================================
      - name: Collect APK artifacts
        id: collect
        run: |
          set -e
          mkdir -p dist
          echo "搜索 APK..."
          find . -type f -name "*.apk" -not -path "./dist/*" | tee apk_list.txt

          COUNT=$(wc -l < apk_list.txt)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未找到任何 APK 产物，请检查 build.log"
            echo "---- build.log 末尾 ----"
            tail -n 120 build.log || true
            exit 1
          fi

          while IFS= read -r f; do
            cp "$f" dist/
          done < apk_list.txt

          ls -lh dist/
          echo "apk_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version info
        run: |
          cd dist
          for f in *.apk; do
            case "$f" in
              *arm64-v8a*) NEW="quizassistant-arm64-v8a.apk" ;;
              *armeabi-v7a*) NEW="quizassistant-armeabi-v7a.apk" ;;
              *x86_64*) NEW="quizassistant-x86_64.apk" ;;
              *) NEW="quizassistant-$f" ;;
            esac
            mv "$f" "$NEW" 2>/dev/null || true
          done
          ls -lh

      # ============================================================
      # 10. 上传 APK artifact
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizassistant-apk-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # ============================================================
      # 11. 失败时上传日志，便于排查
      # ============================================================
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            build-*/
          retention-days: 7
          if-no-files-found: ignore

      # ============================================================
      # 12. 打 tag 时创建 Release 并附带 APK
      # ============================================================
      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
